
<!DOCTYPE html>

    <title>Terraria Database</title>

    <link rel="stylesheet"
          type="text/css"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <body id="top">
    <div id="container">

        <header>
            <h1>Database</h1>
        </header>

        <nav>
        </nav>



    <section class="navbar">

        <h2><a href="{{ url_for('render_home') }}">Home page</a></h2>

        <h2><a href="{{ url_for('render_zenith') }}">Zenith</a>

         <h2>

        <form action="{{ url_for('render_data') }}" method="GET" class="search-form">
    <input
        type="search"
        name="name"
        placeholder="Search by name"
        value="{{ name_search }}"
    >
    <button type="submit">Search</button>
</form>


</h2>


        <h2>
                <form action="{{ url_for('render_data') }}" method="GET" class="search-form">
    <input
        type="search"
        name="type"
        placeholder="Search by type"
        value="{{ type_search }}"
    >
    <button type="submit">Search</button>
</form>

        </h2>

</h2>

        <h2>
                <form action="{{ url_for('render_data') }}" method="GET" class="search-form">
    <input
        type="search"

        placeholder="Search all columns"
        value="{{ all_search }}"
    >
    <button type="submit">Search</button>
</form>

</h2>


     </section>

        <section>

            {% block main %}{% endblock %}
