{% extends "base.html" %}

{% block main %}
    {%  for row in cards %}
   <article>
   <h3 class=name>{{row[1] }}<br><img src="/static/images/{{row[7] }}.jpg"></h3>
   <table>
        <tr>
            <td>{{row[0] }}</td>
            <td>{{row[2] }}</td>
            <td>{{row[3] }}</td>
        </tr>
        <tr>
            <td class=number>Value: ${{row[4] }}</td>
            <td class=number>Defence: {{row[9] }}</td>
            <td>{{row[5] }} {{row[6] }}</td>
        </tr>
   </table>

            <p>{{row[10] }}</p>

   </article>
    {% endfor %}
{% endblock %}
